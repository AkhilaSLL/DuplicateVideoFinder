[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupvideo"
version = "1.3.1"
description = "Find and remove duplicate / near-duplicate videos, safely."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AkhilaSLL" }]
keywords = ["duplicate", "video", "dhash", "perceptual-hash", "tkinter"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "numpy>=1.24",
    "Send2Trash>=1.8",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0"]

[project.gui-scripts]
dupvideo = "dupvideo:main"

[project.urls]
Homepage = "https://github.com/AkhilaSLL/DuplicateVideoFinder"
Issues = "https://github.com/AkhilaSLL/DuplicateVideoFinder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]

[tool.pyright]
# Without these, every `import cv2` / `import numpy` / `from dupvideo...`
# shows up as an unresolved-import squiggle in the editor.
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts", "run.py"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
